# Da Vinci code intake: code written by the Da Vinci AI assistant arrives here and becomes a pull request.
#
#  Da Vinci (GPT Action or tools/davinci_send.py)
#     -> POST /repos/BajanBob/APRS-Tradewins/dispatches  {"event_type": "davinci-code", "client_payload": {...}}
#     -> this workflow: files written to branch davinci/<name>, self-test run, pull request opened (or updated)
#     -> you review and merge; merging to main runs the normal Windows / Linux / Android builds.
#
# Da Vinci never pushes to main and cannot change anything in .github/.
# Payload format: tools/davinci_apply.py.  Set-up: docs/davinci/README.md.
# Also runnable by hand: Actions -> "Da Vinci code intake" -> Run workflow, paste the payload JSON.
name: Da Vinci code intake

on:
  repository_dispatch:
    types: [davinci-code]
  workflow_dispatch:
    inputs:
      payload:
        description: 'Payload JSON: {"title": "...", "files": [{"path": "...", "content": "..."}]}'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The payload only ever goes through files and environment variables, never into a command line.
      - name: Read the payload
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          INPUT_PAYLOAD: ${{ github.event.inputs.payload }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            printf '%s' "$DISPATCH_PAYLOAD" > "$RUNNER_TEMP/payload.json"
          else
            printf '%s' "$INPUT_PAYLOAD" > "$RUNNER_TEMP/payload.json"
          fi

      - name: Check the intake tool
        run: python tools/test_davinci_apply.py

      - name: Plan
        id: plan
        run: |
          python tools/davinci_apply.py plan "$RUNNER_TEMP/payload.json" > "$RUNNER_TEMP/plan.json"
          python - "$RUNNER_TEMP/plan.json" "$RUNNER_TEMP" >> "$GITHUB_OUTPUT" <<'EOF'
          import json, sys
          p = json.load(open(sys.argv[1]))
          tmp = sys.argv[2]
          open(f"{tmp}/title.txt", "w").write(p["title"])
          open(f"{tmp}/message.txt", "w").write(p["message"] + "\n\nSent-by: Da Vinci (AI assistant) via davinci-intake\n")
          open(f"{tmp}/body.txt", "w").write(p["body"])
          print(f"branch={p['branch']}")
          print(f"dry_run={'true' if p['dry_run'] else 'false'}")
          EOF

      - name: Start from the branch (or a new one from main)
        env:
          BRANCH: ${{ steps.plan.outputs.branch }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi

      - name: Apply Da Vinci's files
        run: python tools/davinci_apply.py apply "$RUNNER_TEMP/payload.json" --root . --summary "$RUNNER_TEMP/changes.md"

      - name: Self-test
        id: test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libportaudio2 >/dev/null
          pip install -q -r requirements.txt
          if python test_modem.py > "$RUNNER_TEMP/test.log" 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          tail -n 25 "$RUNNER_TEMP/test.log"

      - name: Commit, push and open the pull request
        if: steps.plan.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.plan.outputs.branch }}
          TEST_OK: ${{ steps.test.outputs.ok }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "Da Vinci (via davinci-intake)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes - the files already match $BRANCH."
            exit 0
          fi
          git commit -q -F "$RUNNER_TEMP/message.txt"
          git push -q origin "$BRANCH"
          {
            cat "$RUNNER_TEMP/body.txt"; echo
            echo "### Files"; cat "$RUNNER_TEMP/changes.md"; echo
            if [ "$TEST_OK" = "true" ]; then echo "### Self-test: passed ✅"; else echo "### Self-test: FAILED ❌"; fi
            echo '```'; tail -n 25 "$RUNNER_TEMP/test.log"; echo '```'
            echo "[Intake run]($RUN_URL) · sent by Da Vinci. Review before merging."
          } > "$RUNNER_TEMP/pr.md"
          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr comment "$BRANCH" --body-file "$RUNNER_TEMP/pr.md"
          else
            gh pr create --base main --head "$BRANCH" --title "$(cat "$RUNNER_TEMP/title.txt")" \
              --body-file "$RUNNER_TEMP/pr.md" $( [ "$TEST_OK" = "true" ] || echo --draft )
          fi

      - name: Dry run result
        if: steps.plan.outputs.dry_run == 'true'
        env:
          TEST_OK: ${{ steps.test.outputs.ok }}
        run: |
          echo "Dry run - nothing pushed. Self-test ok: $TEST_OK"
          cat "$RUNNER_TEMP/changes.md"

      - name: Fail the run if the self-test failed
        if: steps.test.outputs.ok != 'true'
        run: |
          echo "::error title=Self-test failed::Da Vinci's change breaks test_modem.py - see the pull request (opened as a draft)."
          exit 1
