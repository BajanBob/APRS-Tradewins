# Builds Tradewind.apk for Android phones.
#  - Every push to main: download the .apk from the run's "Artifacts" section.
#  - Push a tag like v1.0 (or publish a Release with a new tag): the .apk is
#    attached to that Release next to Tradewind.exe.
#  - Actions tab -> "Build Android apk" -> "Run workflow" builds on demand.
# The first build takes 20-40 minutes (it downloads the Android SDK/NDK);
# later builds reuse the cache and are much faster.
name: Build Android apk

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev

      - name: Install buildozer
        run: pip install --upgrade pip buildozer cython setuptools

      - name: Stage app files
        run: |
          mkdir -p android_build/src
          cp buildozer.spec android_build/
          cp app.py afsk.py tnc.py vhf_prop_aprs.py faceplate.html icon.png android_build/src/
          cp android_main.py android_build/src/main.py

      - name: Cache Android SDK / NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android_build/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Build APK
        working-directory: android_build
        run: yes | buildozer android debug

      - name: Collect APK
        run: cp android_build/bin/*.apk Tradewind.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Tradewind-android
          path: Tradewind.apk

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Tradewind.apk
